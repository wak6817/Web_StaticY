<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>icons</title>
    <style>
      .icons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 1rem;
      }

      .icon-card {
        text-align: center;
      }

      .icon-card img {
        display: block;
        width: 48px;
        height: 48px;
        margin: 0 auto 0.5rem;
      }
    </style>
  </head>
  <body>
    <section class="icons" aria-label="Icon preview">
      <div class="icon-card">
        <img src="/icons/checkmark.svg" alt="Checkmark icon" />
        <div>checkmark</div>
      </div>

      <div class="icon-card">
        <img src="/icons/heart.svg" alt="Heart icon" />
        <div>heart</div>
      </div>

      <div class="icon-card">
        <img src="/icons/star.svg" alt="Star icon" />
        <div>star</div>
      </div>
    </section>
  </body>
</html>
