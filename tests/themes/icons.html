<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>icons</title>
    <style>
        .icons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 1rem;
        }

        .icon-card {
            text-align: center;
        }

        .icon-card img {
            display: block;
            width: 48px;
            height: 48px;
            margin: 0 auto 0.5rem;
        }
    </style>
</head>
<body>
<section aria-label="Icon preview" class="icons">
    <div class="icon-card">
        <img alt="Checkmark icon" src="/assets/icons/checkmark.svg"/>
        <div>Checkmark</div>
    </div>

    <div class="icon-card">
        <img alt="Heart icon" src="/assets/icons/heart.svg"/>
        <div>Heart</div>
    </div>

    <div class="icon-card">
        <img alt="Star icon" src="/assets/icons/star.svg"/>
        <div>Star</div>
    </div>
</section>
</body>
</html>
